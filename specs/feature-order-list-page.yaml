spec:
  type: feature
  name: 订阅制 SaaS 后台订单列表页（1440×900 单屏设计稿）
  id: feature-order-list-page
  version: 4
  updated: "2026-10-08"
  status: verified
  blocked_reason: ""
  status_log:
    - date: "2026-10-08"
      from: none
      to: ready
      by: spec-writer
      version: 1
      note: "本轮前提已由用户拍板（订阅制 SaaS / 只出 1 屏 1440×900 / neutral-modern 预设 / frame id=order-list / 只做设计稿不做落地代码），14 条验收标准各带可复现的检查命令，可开工。"
    - date: "2026-10-08"
      from: ready
      to: in_progress
      by: lead
      version: 2
      note: "设计已落地到 frame order-list，进入独立验收"
    - date: "2026-10-08"
      from: in_progress
      to: done
      by: lead
      version: 3
      note: "设计稿完成并已在最终版上通过独立验收：61 条检查 0 不通过"
    - date: "2026-10-08"
      from: done
      to: verified
      by: lead
      version: 4
      note: "独立验收（design-verifier）在最终版 61/61 通过，0 不通过"
  related: []
  goal: >-
    在 DSH 设计画布的 frame order-list 上产出一屏 1440×900 的订阅制 SaaS 后台订单列表页设计稿，
    落到 .design/frames/order-list.html：自包含、只引用 neutral-modern 预设的 token、内容为订阅订单
    （含新购、续费与退款），并通过本 SPEC 的全部 14 条可复现验收标准。
  context: |
    项目背景：本仓库是 DSH 的设计画布插件，设计真源是 .design/ 下的文件（design.json + frames/*.html + tokens.css），
    画布只是空间容器与编辑入口。用户在对话里提出「设计一个 SaaS 后台订单列表页」，本次任务就是把这个需求落成一屏设计稿。

    本轮前提（已由用户确认，直接按此执行，不要再当作问题提出）：
    1. 业务场景：订阅制 SaaS 后台。订单 = 订阅订单，包含新购、续费与退款，不是实物电商订单
       （不得出现「待发货 / 发货 / 物流 / 收货地址」这类语义）。
    2. 范围：只出 1 屏，1440×900 桌面端订单列表页。不做订单详情页，不做空状态页。
    3. 视觉预设：design-system/tokens/neutral-modern.css（中性现代 · 浅色）。该文件已被逐字拷贝为 .design/tokens.css；
       本屏内联的 :root 必须与它逐变量一致，这样换预设只需整块替换 :root。
    4. 落地位置：画布 frame id=order-list，文件 .design/frames/order-list.html。
    5. 本轮只做设计稿（画布 frame）。不做「落地到项目」的代码生成，不写 src/ 下的项目代码。

    现状（2026-10-08 写作时用 design_status 与 read 实测）：
    - design.json 里 order-list 帧已存在：name=订阅订单列表 · SaaS 后台、file=frames/order-list.html、width=1440、height=900、
      坐标 (0, 0)、status=ready；当前没有任何未处理批注。画布上另有 dashboard / mobile-home 与 4 个验收用帧，本轮都不动。
    - .design/frames/order-list.html 眼下正由设计侧从「起步模板」改造成订阅口径，写作时的快照已经基本成形：
      左侧导航 + 顶栏 + 页头 h1「订单」+ 筛选栏 5 项（全部 1,286 / 待支付 12 / 生效中 1,042 / 退款中 9 / 已关闭 223）+
      数据表 9 列（行选择列 + 订单号 / 客户 / 订阅内容 / 金额 / 支付方式 / 下单时间 / 状态 / 操作）共 7 行 +
      分页「共 1,286 条 · 每页 20 条」+ 页码 1 / 2 / 3 / … / 65。
      该快照已满足：计数自洽（12 + 1,042 + 9 + 223 = 1,286）、必需列齐全、金额右对齐 + tabular-nums、
      零外链零 script、内联 :root 与预设逐字一致、无 emoji / 渐变 / Lorem。
      该快照的订阅语义已经补齐：订单号列下带了订单类型标记，7 行 = 新购 4 行 + 续费 · 自动扣款 3 行，另有 1 行退款相关（退款中）。
      AC9（表结构 + 订阅语义）由独立验收复核一遍，确认 8 个必需列齐全，且续费与退款各至少 1 行。
    - 因为文件在并行推进，本 SPEC 的 AC 一律按「属性」判定（例如「总数等于筛选栏『全部』的计数」），不锁死具体措辞：
      「生效中 / 已生效」「区间写法 / 每页写法」这类同义表达都算通过；但自包含、token 纪律、计数自洽、
      必需列齐全、行数 ≥ 7、续费与退款各 ≥ 1 行这些硬属性必须成立。
    - .design/tokens.css 与 design-system/tokens/neutral-modern.css 逐字一致（56 个变量），无需改动。

    检查口径来源：design-system/README.md（token 契约：零外链 / 零 script / 零 img / 逐字 :root / 颜色字号间距只用变量）、
    prompts/design-conventions.md（反 AI 味清单、中文排版规则、单屏结构写法）。

    已确认的边界取舍：表内订单号、客户名、邮箱、金额都是演示用的示例数据，允许出现在表格里，
    但必须在文件头的 HTML 注释中声明为示例数据；被禁止的是编造用户评价、客户证言与「已服务 N 家团队」这类信任标记。
  assumptions:
    - 用户的 5 条前提视为已完成澄清，不再重复提问；本 SPEC 不保留 open_questions。
    - 本轮只改 .design/frames/order-list.html 与它在 design.json 里的记录；不动其他帧、不动 .design/tokens.css、不动 design-system/。
    - 表内示例数据（订单号 / 客户 / 金额 / 支付方式）是演示数据，不代表真实业务数据，只要在文件头注释里声明即可保留。
    - 沿用现有起步模板的类名锚点（.page-head / .btn-primary / .tab / .tab-num / .amount / .num / .pager / .table-foot），
      验收命令按这些锚点写；若执行时确实要改名，必须同时更新本 SPEC 里对应的检查命令。
    - 验收由 Lead 在用户确认后按本 SPEC 逐条执行；本 SPEC 只负责把可判定的标准固定下来。
  blocking_questions: []
  open_questions: []

  inputs:
    - name: 用户需求原话
      description: 「设计一个 SaaS 后台订单列表页」；结合已确认前提 = 订阅制 SaaS、只出 1 屏 1440×900、neutral-modern 预设。
      source: 用户输入（DSH 对话）
      required: true
    - name: 设计契约
      description: token 命名与模板硬约束（零外链、逐字 :root、颜色/字号/间距只能用变量）见 design-system/README.md；
        反 AI 味清单、中文排版与单屏结构写法见 prompts/design-conventions.md。
      source: 文件（仓库内）
      required: true
    - name: 视觉预设取值
      description: neutral-modern 的 56 个变量（颜色 / 字体 / 字号 / 行高 / 字重 / 间距 / 圆角 / 阴影 / 布局），
        是 frame 内联 :root 的唯一来源；.design/tokens.css 是它的逐字拷贝。
      source: 文件 design-system/tokens/neutral-modern.css 与 .design/tokens.css
      required: true
    - name: 现有帧与工程状态
      description: .design/design.json（frame 列表、尺寸、坐标、批注）与 .design/frames/order-list.html 全文
        （起步模板，本轮的改造起点）。
      source: 文件 + design_status 工具
      required: true

  outputs:
    format: 单文件自包含 HTML（一屏一个文件）+ design.json 中的帧记录更新（不新增帧，只保持 order-list 的登记与文件一致）
    schema: |
      .design/design.json 的 frames[] 记录（本帧必须保持）：
        { id: "order-list", name: "订阅订单列表 · SaaS 后台", file: "frames/order-list.html",
          width: 1440, height: 900, x: 0, y: 0, status: "ready" }

      .design/frames/order-list.html 的结构契约（单屏，1440×900 视口，允许纵向滚动）：
        1) 左侧导航 aside.side：品牌位 + 分组导航（工作台 / 财务与设置）+ 当前项高亮（订单）+ 底部当前用户
        2) 顶栏 header.topbar：搜索框（中文占位文案）+ 通知 + 次级操作（如导出报表），不放主色实心按钮
        3) 页头 .page-head：唯一的 h1.page-title「订单」+ 一句中文副标题 + 恰好 1 个主操作（.btn-primary，如「新建订单」）
        4) 筛选栏 .toolbar：≥4 个 .tab 状态筛选项（含「全部」），每项带 .tab-num 计数；「全部」计数 = 其余各项之和；另有次级「筛选」入口
        5) 数据表 table：必需 8 列 —— 订单号 / 客户 / 订阅内容 / 金额 / 支付方式 / 下单时间 / 状态 / 操作
           （允许在最前面加一列行选择复选框，表头文案为空）；tbody ≥ 7 行
        6) 分页 .table-foot：左侧「显示 X–Y 条，共 N 条」，右侧上一页 / 页码 / 下一页

      表格数据口径（示例，可直接采用，保证计数自洽）：
        筛选项：全部 1,284 = 待支付 38 + 已生效 1,102 + 续费成功 96 + 退款中 12 + 已退款 36
        状态取值只能来自：待支付 / 已生效 / 续费成功 / 退款中 / 已退款 / 已取消
        表内出现的每个状态都必须在筛选栏里有同名筛选项；7 行里至少 1 行续费、至少 1 行退款相关
        金额格式：¥12,400.00（千分位 + 两位小数，右对齐，tabular-nums）
    path: .design/frames/order-list.html

  constraints:
    - 一屏一文件：只产出 1 个 frame（id=order-list，1440×900），不新增帧、不做详情页、不做空状态页。
    - 文件自包含：样式内联在 <style> 里；零外链、零 <script>、零 <img>、零 <link>、零 <iframe>、零渐变。
      （xmlns="http://www.w3.org/2000/svg" 命名空间声明与 href="#i-xxx" 片段引用不算外链。）
    - 颜色只能写 var(--color-*) 或 color-mix(in srgb, var(--color-*) N%, transparent)；字号只能写 var(--text-*)；
      内外边距（margin / padding / gap）只能写 var(--space-*)；1~2px 发丝线（border / outline 宽度）与 0/auto 是允许的例外。
    - 内联 :root 必须与 design-system/tokens/neutral-modern.css 的 :root 逐变量、逐取值、逐顺序一致（56 个变量）；
      本轮不得修改 .design/tokens.css 与 design-system/ 下任何文件。
    - 内容必须是订阅语义：订阅内容列写「套餐 + 席位数 + 计费周期」，状态覆盖新购 / 续费 / 退款；
      不得出现「待发货 / 发货 / 物流 / 收货地址」等实物电商字样，也不得保留起步模板里没有真实来源的经营数字（KPI 卡片区）。
    - 中文排版：正文 ≥ 14px 且行高 ≥ 1.5；h1 用 ≥ var(--weight-semibold) 的字重 + 负字距（如 -0.02em），
      小标签用正字距（如 0.06em）；中英文之间加空格；中文句子用全角标点。
    - 文件体积必须小于 2 MiB（2,097,152 字节）且大于 0 字节——画布写通道的硬上限。
    - 类名锚点（.page-head / .btn-primary / .tab / .tab-num / .amount / .num / .pager / .table-foot）沿用现有文件，
      以便验收命令可复现；确需改名时同步更新本 SPEC 的检查命令。
    - 单一写者：本轮 order-list.html 同一时刻只允许一个成员编辑；本 SPEC 的写范围仅 specs/。
  out_of_scope:
    - 订单详情页 / 抽屉 / 弹窗等二级界面
    - 空状态、加载骨架、错误态、无权限态等特殊页面
    - 「落地到项目」代码生成（不生成 src/ 下的组件，不下发 prompts/design-handoff.md 流程）
    - 真实数据接入、接口联调、筛选/排序/翻页的真实交互逻辑（本轮是静态设计稿）
    - 移动端与响应式断点（只做 1440×900 桌面端）
    - 新增 token 变量、新增预设、修改 design-system/ 或 .design/tokens.css
  tools:
    - design_status
    - design_frame_write
    - design_canvas_apply
    - read / write / edit / grep / glob
    - bash（跑 AC 里的 python 检查命令与 wc -c）
    - mcp__playwright-mcp（browser_navigate / browser_resize / browser_take_screenshot / browser_evaluate，用于在 127.0.0.1:3080 的画布上截图核对）

  steps:
    - "S1 读现状：调 design_status 确认 order-list 是 1440×900、无未处理批注；再 read .design/tokens.css 与 .design/frames/order-list.html 全文，不要凭记忆重画。"
    - "S2 先把数据算平：确定 8 列表头、≥7 行示例数据、每个状态的行数与筛选项计数，保证「全部 = 各状态之和」并且表尾「共 N 条」与「全部」一致。"
    - "S3 改语义：把实物电商口径换成订阅口径（订阅内容 = 套餐 + 席位数 + 计费周期；补「支付方式」列；去掉没有真实来源的 KPI 卡片区），保留可用的骨架与类名锚点。"
    - "S4 收敛主操作：整屏只留 1 个主色实心按钮（.btn-primary）并放在页头 .page-head；顶栏与筛选栏的控件降为次级（描边 / 文字 / 分段控件）。"
    - "S5 排版收口：正文 ≥14px 且行高 ≥1.5；h1 加字重与负字距、小标签加正字距；金额列右对齐 + tabular-nums；中英文之间加空格、中文用全角标点。"
    - "S6 自检：逐条跑 AC1–AC14 的检查命令，如实记录输出，FAIL 的改到 PASS（不许跳过或口头放过）。"
    - "S7 交付：回报 frame id、文件路径、字节数、逐条 AC 自检结果；状态推进（done / verified）由 Lead 在用户确认后执行，执行者不自行标注。"

  acceptance_criteria:
    - |-
      AC1 帧与文件：design_status 返回的 frames[] 里存在 id=order-list 的帧，且 width=1440、height=900、file=frames/order-list.html；
      .design/frames/order-list.html 的字节数落在开区间 (0, 2097152) 内（0 字节与 ≥2 MiB 都会被画布写通道拒绝）。
      检查：调 design_status 读 frames；再跑 python3 -c "import pathlib;print(pathlib.Path('.design/frames/order-list.html').stat().st_size)"。
      期望：帧存在、宽高精确等于 1440 与 900、字节数 ∈ (0, 2097152)；帧不存在或宽高不符即判失败。
    - |-
      AC2 自包含：零外链、零 script、零 img、零 link、零 iframe，样式全部内联在 <style> 块里（至少 1 个）；
      http 字样只允许出现在 xmlns="http://www.w3.org/2000/svg" 命名空间声明里。
      检查（仓库根目录执行）：
        grep -n "http" .design/frames/order-list.html
        python3 - <<'PY'
        import re, pathlib
        s = pathlib.Path('.design/frames/order-list.html').read_text(encoding='utf-8')
        print('script', len(re.findall(r'<script\b', s)), 'img', len(re.findall(r'<img\b', s)),
              'link', len(re.findall(r'<link\b', s)), 'iframe', len(re.findall(r'<iframe\b', s)),
              'style', len(re.findall(r'<style\b', s)))
        print('外链属性', re.findall(r'(?:src|href)\s*=\s*"(?!#)[^"]*"', s), 'import', re.findall(r'@import', s))
        PY
      期望：script / img / link / iframe 计数全为 0；style 计数 ≥ 1；外链属性与 @import 都是空列表；grep http 的命中只剩 xmlns 那一行。
    - |-
      AC3 预设逐字一致：frame 内联的 :root 与 design-system/tokens/neutral-modern.css 的 :root 逐变量、逐取值、逐顺序一致（56 个变量），
      且 .design/tokens.css 作为逐字拷贝与两者也一致（三方一致）。
      检查：
        python3 - <<'PY'
        import re, pathlib
        def pairs(css):
            b = re.search(r':root\s*\{(.*?)\}', css, re.S).group(1)
            return [(k, v.strip()) for k, v in re.findall(r'(--[a-z0-9-]+)\s*:\s*([^;]+);', b)]
        preset = pathlib.Path('design-system/tokens/neutral-modern.css').read_text(encoding='utf-8')
        mirror = pathlib.Path('.design/tokens.css').read_text(encoding='utf-8')
        frame = pathlib.Path('.design/frames/order-list.html').read_text(encoding='utf-8')
        inline = re.search(r'<style>(.*?)</style>', frame, re.S).group(1)
        a, b, c = pairs(preset), pairs(mirror), pairs(inline)
        print(len(a), len(b), len(c), 'PASS' if a == b == c else 'FAIL')
        PY
      期望：输出 56 56 56 PASS；少一个变量、改一个取值、调一次顺序都判失败（改法是把整块 :root 换成预设内容，不是逐条手改）。
    - |-
      AC4 颜色只用 token：:root 块之外不出现任何颜色字面量——没有 #hex、没有 rgb()/rgba()/hsl()、没有具名颜色；
      颜色只能写 var(--color-*)、color-mix(in srgb, var(--color-*) N%, transparent)、transparent、currentColor、inherit。
      检查：
        python3 - <<'PY'
        import re, pathlib
        s = pathlib.Path('.design/frames/order-list.html').read_text(encoding='utf-8')
        css = re.search(r'<style>(.*?)</style>', s, re.S).group(1)
        css = re.sub(r':root\s*\{.*?\}', '', css, flags=re.S)
        inline = ' '.join(re.findall(r'style="([^"]*)"', s))
        pat = r'#[0-9a-fA-F]{3,8}\b|\brgba?\(|\bhsla?\(|(?<![\w-])(?:white|black|red|blue|green|gray|grey|orange|purple|pink|yellow|brown|navy|teal|beige|ivory|silver|gold|maroon|olive|lime|aqua|fuchsia|cyan|magenta)(?![\w-])'
        hits = re.findall(pat, css + ' ' + inline)
        print('PASS' if not hits else 'FAIL ' + str(hits[:5]))
        PY
      期望：输出 PASS（命中 0 处）；命中就按报出的片段改回 token 或 color-mix 派生，不允许「就这一次」写死色值。
    - |-
      AC5 字号与间距只用 token：样式里每一条 font-size 的取值都是 var(--text-*)（或 inherit）；
      每一条 margin / padding / gap / row-gap / column-gap 的取值只由 var(--space-*) 和 0 / auto 组成；
      1~2px 的 border / outline 宽度、以及宽度高度类属性（width / height / min-width 等）不在本条范围。
      检查：
        python3 - <<'PY'
        import re, pathlib
        s = pathlib.Path('.design/frames/order-list.html').read_text(encoding='utf-8')
        css = re.search(r'<style>(.*?)</style>', s, re.S).group(1)
        css = re.sub(r':root\s*\{.*?\}', '', css, flags=re.S)
        bad = []
        for m in re.finditer(r'font-size\s*:\s*([^;}]+)', css):
            if not re.fullmatch(r'var\(--text-[a-z0-9]+\)|inherit', m.group(1).strip()):
                bad.append(('font-size', m.group(1).strip()))
        for m in re.finditer(r'\b(?:margin|padding)(?:-(?:top|right|bottom|left))?\s*:\s*([^;}]+)|\b(?:gap|row-gap|column-gap)\s*:\s*([^;}]+)', css):
            val = (m.group(1) or m.group(2)).strip()
            for t in val.split():
                if t in ('0', 'auto') or re.fullmatch(r'var\(--space-[0-8]\)', t):
                    continue
                bad.append(('spacing', val)); break
        print('PASS' if not bad else 'FAIL ' + str(bad[:5]))
        PY
