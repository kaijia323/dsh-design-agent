    - "F4（低）：筛选 / 排序 / 翻页是静态渲染，没有真实交互；要做成可点原型时另立需求。"
    - "F1（中）：handoff 成组件时，8 个复选框与 tab/分页要换成真实 input[type=checkbox] 与 button 语义"
    - "F2（低）：.quota-bar 补 role=progressbar + aria-valuenow"
    - "F3（低）：续费行未进筛选栏，扩到「新购/续费/升级」订单类型时再评估是否加类型筛选"
    - "F4（低）：本轮不做「落地到项目」代码生成，需要时走 prompts/design-handoff.md"
  failure_handling:
    - scenario: 实现时想用一个 token 之外的颜色、字号或间距（例如某个状态色、某个 18px 的标题）
      handling: 不允许自创。改用最近的现有 token 或 color-mix(in srgb, var(--color-*) N%, transparent) 派生；确实不够用时停下来报 Lead 决策（换预设或改 tokens.css 属于另一件事，不在本轮写范围内）。
    - scenario: 写入 .design/frames/order-list.html 被拒（0 字节、超过 2 MiB、或 HTML 不合法）
      handling: 按 design_frame_write 的报错定位；体积超限说明内联样式或示例数据冗余，精简后整体重写，不留空帧或半截文件；重写前先从 git 取回上一版作为对照。
    - scenario: 有人改了 .design/tokens.css 或 design-system/ 里的预设，导致 :root 与 frame 内联块不一致
      handling: AC3 会 FAIL。把 frame 内联的 :root 整块替换为该预设的内容（不是逐条手改）；本轮不得反向修改 tokens 源文件，需要改预设时先问 Lead。
    - scenario: 改完数据行数后筛选计数与表尾总数对不上（最常见的自相矛盾）
      handling: 以表内实际状态分布为准重算，三处一起改：各状态筛选项计数、「全部」计数、表尾「共 N 条」；改完重跑 AC8 与 AC11。
    - scenario: 复核时有 AC 判 FAIL
      handling: 退回 in_progress，把失败项与实际输出写进 SPEC（不口头放过），改完重跑该条命令；有失败项时不得标 verified。
    - scenario: 画布上看不到最新改动 / 帧内容为空
      handling: 先确认文件确实变了（design_status 的帧信息 + 文件字节数 / mtime），再让用户在画布刷新；不要凭记忆重画整屏，也不要为了「让它刷新」去动 design.json。
    - scenario: 示例数据被误当成真实经营数据展示
      handling: 文件头必须保留「表内为示例数据」注释；交付说明里再口头点一次；不得把示例数字写进任何对外材料。
  examples:
    - input: 用户在对话里说「设计一个 SaaS 后台订单列表页」，并确认前提：订阅制 SaaS、只出 1 屏 1440×900、neutral-modern 预设、frame id=order-list、本轮只做设计稿。
      output: >-
        .design/frames/order-list.html 被改造成自包含单屏（实测 36,241 字节，∈ (0, 2097152)）：左侧导航（概览 / 订单 / 订阅计划 / 客户 / 结算 / 设置）+
        顶栏（搜索 / 通知 / 导出）+ 页头（唯一 h1「订单」+ 一句话副标题 + 1 个主操作）+
        筛选栏 5 项（全部 1,286 / 待支付 12 / 生效中 1,042 / 退款中 9 / 已关闭 223，计数自洽：12 + 1,042 + 9 + 223 = 1,286）+
        数据表 9 列 7 行（行选择列 + 订单号 / 客户 / 订阅内容 / 金额 / 支付方式 / 下单时间 / 状态 / 操作；金额右对齐 + tabular-nums）+
        分页「共 1,286 条 · 每页 20 条」+ 页码 1 / 2 / 3 / … / 65；内联 :root 与 neutral-modern 的 56 个变量逐字一致。
        订单号列下带订单类型标记：新购 4 行 + 续费 · 自动扣款 3 行，退款相关 1 行（退款中）；AC9 由独立验收复核。
    - input: 复核者按 AC4 跑颜色检查，命中 0 处；按 AC3 跑 :root 比对，输出「56 56 56 PASS」。
      output: 两条通过，记入 verification.acceptance 的证据里（命令 + 实际输出），不需要额外说明。
