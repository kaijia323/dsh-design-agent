    - date: "2026-10-09"
      from: done
      to: verified
      by: lead
      version: 8
      note: "独立复验（T5）在终版 2c603987bd84c1ef 上跑完全量回归，bundle rev 稳定、跨版本数据一律作废重跑；D7（胶囊与紧邻打字并进同一条撤销记录）修复后复验通过。"
  related: []
  goal: "在右侧栏设计预览里点一个元素时，不再弹出元素属性面板，而是把这个元素的定位信息直接写进聊天输入框；用户接着打字说明要改什么即可，元素批注交互从界面退场。"
  context: |
    现状（client.js）：iframe 探针 postMessage {type:'select', info} → Preview.onSelectElement → setSelected({frameId, info}) → 渲染 Inspector 抽屉（文字/颜色/字号/内外边距 + 就这个元素写批注 + 批注列表），并 bridge.writeFrame 把改动写回 .design/frames/<id>.html。

    用户看过真实界面后否决了这个弹层：它把「改设计」变成一个自带 6 个输入框的小表单，而用户真正想说的是自然语言（「这个按钮太土了」）。真正缺的能力是把「我在说哪个元素」这件事无损地告诉 agent，而聊天输入框是 DSH 里已有的、用户天天在用的输入面。

    技术路径（已在 DSH 源码里核对，非猜测）：
    - @deepseek-ai/dsh-client-ui-conversation 通过 ctx.uiSession.provide({ props: ['inputActions'] }) 把 InputActions（实际只有 captureInsertion / insertText / setDraft / persistDraft / addAttachments / removeAttachment / pruneAttachments / submit 八个方法，**没有 state**）发给每个 session 作用域的插槽组件。
    - 本插件的预览面板挂在 sidebar.right.pane.tab（keyed，session 级），因此组件 props 上就有 inputActions。
    - insertText 落到 shell 自有的 Lexical 编辑器上（insertAsyncText），不依赖输入框有焦点，实现一次撤销、不会覆盖用户后续编辑（span 带 draftRev 校验）；失焦时 captureInsertion() 返回的 {start:0,end:0} 是「没有选区」的默认值而不是「文档为空」，草稿空不空只能从输入框 DOM 判（composerDraftEmpty）；setDraft 会把光标留在文档开头，因此不用它。
    - 该包文档把这条路径定义为「异步文本结果插入」的正式语义，本插件是它的第一个真实调用方。

    形态变更（v6，用户原话）：「点击元素的时候，不要在 DSH 的聊天框输入文字，而是应该像那个艾特符号或者调用指令的那种一样」——引用从「整段纯文本」改为「@ 式引用胶囊」：胶囊标签 = 元素文字 · 屏名，模型文本仍由 codec.serialize 产出五行定位信息。已确认 @ 菜单不做元素枚举（只做点选插入这一条路）。

    交互上的取舍：不主动聚焦（不调 focus()）、不滚动、不跳视口；但为了让「引用完接着打字」落在草稿末尾，会把编辑器选区收拢到文档末尾（collapseComposerCaretToEnd，纯 DOM Range）。代价是输入框会成为 activeElement——这是为达成用户诉求（引用完直接说话）付的、且可接受的一步。
  assumptions:
    - 用户说的「引用」= 把元素的定位信息放进聊天输入框（纯文本），不要求做成 @ 引用胶囊（胶囊是 file-reference 插件的能力，@ 在本产品里被文件引用占用；插入文件路径会误导 agent 去读文件）。
    - .design/design.json 里已有的批注数据保持可读、不删除（design_status 仍返回 comments[]），只是画布不再有写批注的界面。
  blocking_questions: []
  open_questions: []

  inputs:
    - name: "帧内点选事件"
      description: "沙箱 iframe 探针 postMessage {__dshDesign:1, type:'select', info:{path, tag, text, color, background, fontSize, padding, margin}}；path 是 html > body … 的 nth-of-type 选择器"
      source: "iframe postMessage（同源校验 event.source === iframe.contentWindow）"
      required: "true"
    - name: "当前屏信息"
      description: "frame.id / frame.name（来自 .design/design.json 的 frames[]），用于在引用文本里指明是哪一屏的哪个元素"
      source: "客户端已加载的 .design 工程"
      required: "true"
    - name: "聊天输入框动作面"
      description: "会话作用域插槽的标准 props inputActions（captureInsertion(): TokenSpan、insertText(text, span): boolean），由 @deepseek-ai/dsh-client-ui-conversation 经 ctx.uiSession.provide 注入"
      source: "DSH 客户端服务（session 作用域插槽标准 props）"
      required: "true"

  outputs:
    format: "修改后的 client.js（无构建、自包含客户端半）+ 聊天输入框里出现的一段纯文本引用"
    schema: |
      引用文本（每行一条，行间换行，整段追加到草稿末尾）：
        【设计元素】<frame.name>（frame: <frame.id>）
        元素：<info.tag>
        选择器：<info.path>
        当前文字：<info.text 归一化空白并截断 40 字>
        文件：.design/frames/<frame.id>.html
      上述五行以外的字段一律不写（不写颜色/字号/内外边距——用户要点评的是元素，不是属性表）。
    path: "client.js（预览面板的 onSelectElement 与聊天输入框桥接）"

  constraints:
    - 只改客户端 client.js；host 半（index.js、src/host/**）不动，design_canvas_apply 的 op 词表不动（add_comment 等保留，供工具与历史数据继续可用）。
    - 插入文本必须走 inputActions.insertText（带 draftRev 的 span 校验）；禁止用 document.execCommand、直接改 contenteditable、伪造键盘事件等 DOM 注入手段。
    - 不主动聚焦、不滚动：插入路径不调用 inputActions.focus()，不把聊天列滚到底；为了让用户「引用完接着打字」落在末尾，允许把编辑器选区收拢到文档末尾（这会顺带让输入框成为 activeElement），但不允许因此产生滚动、视口跳动或草稿损失。
    - 不允许静默失败：插不进去要看得见原因（失败提示必须出现在预览面板内）。
    - 沙箱红线不变：iframe 仍是 sandbox="allow-scripts"，不得加 allow-same-origin。
    - 引用文本里出现的元素文字要归一化空白、截断 40 字，保证「引用 + 一句话」不把输入框撑成一段长文。
    - 不引入新依赖、不引入构建步骤；client.js 仍是单文件 __ModuleLoader__.load 形态。
    - "引用必须以「引用胶囊」呈现（用户原话：不要在聊天框输入文字，要像 @ 符号或调用指令那种样式），不得再往输入框里插整段纯文本。"
    - "胶囊只走输入框自己的引用管线：注册 inputTriggers 的 @ source（含 codec）+ 用 session 作用域的 slash/input-insert-reference 事件插入；不得自己往 contenteditable 里塞 DOM 或伪造节点。"
    - "source 的 ref 必须自包含（草稿跨刷新持久化，恢复后序列化仍要能工作），不得依赖插件内存里的映射表。"
    - "未成功注册 source 时不得走胶囊路径（否则用户发送会被 no serializer 阻塞）：此时降级为纯文本引用并明确提示。"
    - "不得污染 @ 菜单：source 的 candidates 返回空数组且 showGroupTitle=false，打 @ 时仍只列文件/会话。"

  out_of_scope:
    - 不改 design_status 的返回结构；不在 @ 菜单里枚举设计元素（本期只做「点选插入胶囊」这一条路，用户已确认）。
    - 不做「点元素即自动提交/自动发送」。
    - 不删除 .design/design.json 里的历史批注数据，也不改 host 的 comments 读写实现。
    - 不做回滚/撤销栈（胶囊可用输入框自带的撤销去掉，用户自己就能删）。
    - 不动落地到项目（handoff）路径。

  tools:
    - node --check client.js（语法门）
    - node --test src/host/*.test.js（host 回归，确认没被牵连）
    - playwright（真实 GUI http://127.0.0.1:3080，验证点选 → 输入框真的出现引用）

  steps:
    - 在 client.js 里加一个「会话 → 输入框动作面」的桥：注册一个隐藏的 conversation.input.dock 占位，取得该会话的 inputActions，按 sessionId 存进注入表；预览面板拿不到时给出可见提示而不是静默失败。
    - 删掉 Inspector 组件与它的选中态渲染；工具栏不再有「批注（N）」入口；选中元素不再需要 selected state。
    - 重写 onSelectElement：拼引用文本 → captureInsertion() → insertText()；失败（rev 过期或被锁）重试一次，再失败就提示并把引用文本放进可复制的降级卡片。
    - 底部加一条「最近引用」状态条（含复制按钮），让引用这件事在预览里可见、可核对。
    - 清理只在属性面板里用到的文案与工具函数（props/field*/comment* 文案、rgbToHex），把 pickHint 改成新交互的自解释文案。
    - 给 window.__dshDesignCanvas 补一个测试钩子，让验收者能在不开沙箱帧的情况下构造「点选事件」（沙箱帧内点击自动化不稳）。
    - 更新 README.md / docs/architecture.md，把「就地改元素 + 元素锚点批注」改成「点元素引用到对话」，并记录为什么砍。

  acceptance_criteria:
    - "AC1 点选即出胶囊：在预览 iframe 里点任一元素（沙箱 allow-scripts、无 allow-same-origin），500ms 内聊天输入框里出现一个引用胶囊（DOM 上位于 [data-lexical-decorator] 内，渲染为 @ 标记 + 标签文本），且输入框里不再出现整段纯文本引用、也不再出现元素属性面板。"
    - "AC2 胶囊标签与模型文本：胶囊标签 = <元素文字或标签名> · <屏名>（元素文字空白归一化、按上限截断；无文字元素回落到标签名），胶囊 title 等于该标签；发送时模型收到五行定位文本（【设计元素】屏名（frame: id）/ 元素 / 选择器 / 当前文字 / 文件），由已注册 source 的 codec.serialize 产出，且该 source 能被输入框的引用 roster 解析（不得出现 no serializer）。"
    - "AC3 不打断、可接着写：插入后聊天列 scrollTop 与插入前一致、视口不跳；用户既有草稿内容一字不丢，胶囊落在草稿末尾；插入后光标落在末尾（紧接着打字落在末尾）；一次撤销即可去掉整个胶囊（原子节点）。"
    - "AC4 可连续引用：连点同一屏的两个元素 → 两个胶囊都在、顺序与点击顺序一致、第一个完整保留；先打字再连点两个元素的混合场景读起来通顺（不出现胶囊与文本粘连成不可读的样子）。"
    - "AC5 失败可见与降级：胶囊路径不可用（source 注册失败 / 取不到 session 作用域 / bail 未应用）时自动降级为纯文本引用并在面板内明确提示「已降级为纯文本引用」；两条路都不通时给出可见原因与可复制的引用文本；任何一步都不得静默。"
    - "AC6 边界不炸：对空帧（0 字节）、超限帧、被切走的帧发点选事件，客户端不抛未捕获异常且不写入坏数据；info.text 为空串、info.path 为空串时仍能生成合法胶囊与合法序列化文本。"
    - "AC7 批注 UI 退场、数据不丢、@ 菜单不被污染：工具栏不再有「批注（N）」入口、点元素不再出现「就这个元素写批注」；.design/design.json 里既有 comments[] 不被删除、design_status 仍能返回；键盘打 @ 打开菜单时不出现空分组，仍只列文件/会话。"
    - "AC8 无回归：node --check client.js 通过；node --test src/host/*.test.js 全绿；切屏、落地到项目、探针 setText 通道、帧内高亮不被破坏；全程不写 .design/**。"
  verification:
    result: "8/8 运行级 PASS（AC1~AC8 全过；v7 的 AC5 无法确认项在胶囊形态下变为 PASS——降级路径可构造且可见）。client.js sha256[:16]=2c603987bd84c1ef（2149 行）全程未变，host 50/50，设计契约自检与重启体检一把过，.design 全程零写入。复验期间抓出并修复 D6/D7 两个缺陷。"
    verified_by: independent
    verifier: "teammate-verifier（T5/v8 胶囊形态，全程未参与实现）"
    verified_at: "2026-10-09"
    acceptance:
      - criterion: "AC1 点选即出胶囊"
        status: pass
        evidence: "点选后 15~17ms 输入框出现胶囊；DOM = [data-lexical-decorator] 内 span[data-composer-chip=\"design-element\"]，含 @ 标记 + 标签 + title；反向判据成立：innerText 不匹配五行正则、无「选择器：/当前文字：/文件：」；胶囊 inline-flex 一行渲染、输入框高度 52px 不变"
      - criterion: "AC2 胶囊标签与模型文本"
        status: pass
        evidence: "标签「导出 · 订阅订单列表」且 title 一致；长文本元素 →「启元云 订阅中台 总览 仪表… · 订阅订单列表」；无文字元素 →「button · 订阅订单列表」；serializeRef() 走 roster 路径（inputTriggers.sessionOf(actx).serializeReference）返回逐字五行定位文本、无 no serializer；ref=@design/<base64url>，刷新页面后胶囊仍在且序列化仍成功"
      - criterion: "AC3 不打断、可接着写"
        status: pass
        evidence: "草稿逐字保留且在胶囊之前；胶囊落在草稿末尾；插入后敲 ZZ 落在末尾；一次 Ctrl+Z 原子去掉胶囊且草稿原文不变（D7 修复后：ABCD → 点选 → 一次撤销 → ABCD，不再依赖 2.5 秒间隔）；scrollTop 与视口不变、输入框高度 52px 不变"
      - criterion: "AC4 可连续引用"
        status: pass
        evidence: "连点两个元素 = 2 个胶囊、顺序与点击顺序一致、第一个完整保留；先打字再连点的混合场景草稿在最前、无粘连；一次撤销只掉最后一个胶囊、两次全掉"
      - criterion: "AC5 失败可见与降级"
        status: pass
        evidence: "setChipAvailable(false) 实测：0 胶囊 + 五行纯文本 + 面板可见「引用胶囊不可用，已降级为纯文本引用：…」+ 状态条「（纯文本）」；恢复后回到胶囊、无降级提示。仅「胶囊与纯文本两条路都不通」那一层未构造（登记 unverified）"
      - criterion: "AC6 边界不炸"
        status: pass
        evidence: "无效选择器 / 切走的帧 / 不存在的 frameId / info=null 都不抛异常、不写盘；空 path + 空 tag + 空 text 仍生成合法胶囊（标签「元素 · 订阅订单列表」）且序列化三处兜底齐全；未捕获异常 0"
      - criterion: "AC7 批注 UI 退场、数据不丢、@ 菜单不被污染"
        status: pass
        evidence: "界面零旧文案、无「批注（N）」入口；design_status 仍返回 3 条 comments；打 @ → 菜单 2 组（Files & folders 13 条 / Sessions 50 条）、空分组 0、无本插件分组（截图 ac7-at-menu-final.png）"
