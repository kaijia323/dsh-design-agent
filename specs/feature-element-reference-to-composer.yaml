# v8 起批注能力已整体移除（界面 + 数据 + 工具 + 客户端残留），现行契约见 docs/architecture.md。
spec:
  type: "feature"
  name: "点选设计元素 → 直接引用进对话（去掉元素属性弹层与批注）"
  id: "feature-element-reference-to-composer"
  version: 8
  updated: "2026-10-09"
  status: verified
  blocked_reason: ""
  status_log:
    - date: "2026-10-09"
      from: "draft"
      to: "ready"
      by: "lead"
      version: 1
      note: "用户原话「点击设计元素的时候，不要弹出这个（元素属性面板），应该直接在 dsh 的会话聊天中引用这个点击的元素才对，然后用户自然就会输入要怎么调整，这样的话标注就不需要了，因为用户会直接引用元素直接和 dsh 聊天框聊天」→ 判定为 feature（改变既有交互行为）。契约按用户原话写死：点选即引用、不弹层、批注 UI 退场。"
    - date: "2026-10-09"
      from: "ready"
      to: "in_progress"
      by: "lead"
      version: 2
      note: "实现完成（client.js sha256[:16]=7fb7b8ebadc473b0，1821 行）并进入独立复验。期间自查+复验共修 5 个真缺陷：D1 面板挂载即崩（TDZ）、D2 测试钩子未转发 onPreviewReady、D3 钩子参数错位会假绿、D4 插入后光标塌到文档开头、D5 我修 D4 时引入的回归（InputActions 没有 state，导致分隔符丢失、两条引用粘连）。AC3 判据按用户诉求修正：原「activeElement 仍是预览侧元素」改为「不滚动/不丢草稿/光标落在末尾/一次撤销可恢复」——实现为了让用户接着打字会把选区收拢到草稿末尾，输入框因此成为 activeElement，这正是用户要的。"
    - date: "2026-10-09"
      from: ready
      to: in_progress
      by: lead
      version: 3
