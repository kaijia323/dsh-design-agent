  failure_handling:
    - scenario: "inputTriggers 服务找不到 / source 注册失败（服务名或版本差异）"
      handling: "不启用胶囊路径，点选直接走纯文本引用，并在面板内提示「胶囊不可用，已降级为纯文本引用」；绝不插一个序列化不了的胶囊（那会让用户发送时被 no serializer 拦下）。"
    - scenario: "取不到 session 作用域 ctx（sessions.scope(id) 返回 undefined），或 slash/input-insert-reference 未被应用（返回非 true）"
      handling: "判定为胶囊插入失败 → 用同一 span 直接走纯文本插入（此时编辑器未被修改，span 仍有效），并提示已降级。"
    - scenario: "草稿在刷新后恢复、旧胶囊的 ref 无法解码"
      handling: "codec.serialize 抛出可读错误（按契约「失败阻塞发送、绝不静默降级为剪贴板文本」），错误说明是哪条引用无法解析。"
    - scenario: "inputActions 尚未就绪（聊天列未挂载、会话不可写、plan/goal 等冻结态）"
      handling: "insertText 返回 false 或不可用 → 重试一次（重新 captureInsertion）→ 仍失败则在预览面板内报可见错误，并把引用文本放进可复制卡片（复用已有降级卡片形态），不静默。"
    - scenario: "用户正在输入过程中（draftRev 在 capture 与 insert 之间变化）"
      handling: "span 的 draftRev 校验会拒绝这次插入；重试一次即可拿到新 rev。两次都失败才走可见失败分支。"
    - scenario: "元素文字含大量空白/换行/超长"
      handling: "空白归一化为单空格、截断 40 字后再拼进引用，保证引用永远定长、可读。"
    - scenario: "iframe 未渲染/已被切走/帧内无 body"
      handling: "点选事件根本不会到达（消息源校验），或 info 为空 → 不插入、不报错，只更新状态条为「未选中」。"

