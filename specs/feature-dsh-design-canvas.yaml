spec:
  type: feature
  name: DSH 画布设计插件（对话驱动 UI 设计 → 前端代码）
  id: feature-dsh-design-canvas
  version: 1
  updated: "2026-10-08"
  status: ready
  blocked_reason: ""
  status_log:
    - date: "2026-10-08"
      from: draft
      to: ready
      by: lead
      version: 1
      note: 三个关键岔路口已由用户拍板（定位/画布元素模型/第一版范围），验收标准写全，可以开工。
  related: []
  goal: 让用户在 DSH 聊天窗口里，通过对话让 agent 在无限画布上以「每屏一个真实 HTML」为单位设计 UI，用户可就地拖拽/批注或继续对话修改，满意后由 agent 把设计落成前端代码——从而把「先设计 UI 再写前端」这条流程搬回 AI 研发链路里。
  context: |
    背景与痛点：现在直接让 agent 写前端页面，出来的东西很丑、没设计感。根因不是模型不会写 CSS，而是：
    缺设计契约（token/字号阶梯/间距节奏）、缺参考物、缺自检、缺快速迭代手段（"再往左一点"要用文字来回聊二十轮）。
    因此本插件不只做画布，第一刀同时交付一套内置设计 token 预设，否则画布只会把丑的东西显示得更清楚。

    竞品与情报（2026-10-08 调研结论）：
    - Anthropic 的 Claude Design 已是同形态商业产品：聊天 + 画布、就地批注、可直接拖拽改、设计系统、handoff 给 Claude Code。
    - nexu-io/open-design（Apache-2.0）是开源替代，且把 DSH 当一等公民运行时（`od agent setup deepseek-harness`）；
      但它没有无限画布，只有单页 HTML + 沙箱 iframe 预览；其自带路线图承认"评论式精修只做了一半""参数调节面板还没实现"。
    - 没有任何主流产品把"画布 JSON"当真源：open-design 用 DESIGN.md + 真实文件，Onlook 用代码本身。
    - 设计↔代码双向同步至今无人真正解决（官方 Figma MCP 被批"给的是设计上下文而非可生产代码"）。
    - tldraw SDK 非开源许可：生产环境需付费，免费 hobby 许可强制带水印 → 本方案自研画布，不引入 tldraw。

    本方案的核心取舍（由此得出）：
    1) 真源=文件（`.design/` 下的 design.json + frames/*.html + tokens.css），画布只负责空间布局、编辑入口与实时同步；不发明新格式。
    2) 画布上的元素=真实网页（每屏一个自包含 HTML，沙箱 iframe 渲染），不是矢量图形。
    3) 只做单向 设计→代码，不做反向同步。
    4) 差异化=真无限画布 + 长在 DSH 里（不用开第二个 app）+ 改动与对话进同一个上下文。

    DSH 扩展点（已用 cordis_inspect_list / cordis_inspect_query 实证）：
    - 客户端 `main` slot（keyed，"Central panel selected by sidebar entry id"，当前仅 conversation）→ 全屏画布主面板。
    - 客户端 `sidebar.panellist` slot（list）→ 左侧栏图标，配 `ctx.layout.selectPanel(PANEL_ID)` 切换。
    - 客户端 `shell.overlay` slot（list，frame 级浮层）→ 同屏浮层画布的备选挂载点。
    - 客户端 `tool.call.toolview` slot（keyed by 工具名）→ 聊天流内嵌实时预览卡片（P1）。
    - 客户端已有 Remote 服务 `workspaceFiles`（read/list/stat/changes 流）→ 读文件 + 监听 `.design/` 变更，免自研轮询。
    - 客户端已有服务 `layout` / `locale` / `slots` / `theme`。
    - host 侧服务：`tools`（注册 agent 工具）、`systemPrompt`（注入设计约定）、`fs`（读写）、`storage`、`webServer`（如需自有路由）。
    - 客户端插件包契约（实证自 @deepseek-ai/dsh-client-ui-brand-official 与 dsh-client-ui-plugin-manager）：
      package.json 里 `"dsh": { "client": { "inject": [...], "platform": "web" } }`，exports["./client"] → 打包产物；
      产物形如 `window.__ModuleLoader__.load({ id, factory: (require) => {...; exports.apply; exports.inject} })`；
      主面板注册范式（照抄 plugin-manager）：`ctx.slots.inject("main", function*(){ yield ctx.slots.register({name:"main", key:PANEL_ID, ...}, Page); })`
      + `ctx.slots.inject("sidebar.panellist", () => ctx.slots.register({name:"sidebar.panellist", id:PANEL_ID, order, label}, Icon))`。
  assumptions:
    - 本仓库是全新空目录，从零搭建；不 fork、不修改 DSH 自身代码，只新增一个独立插件包。
    - DSH 运行在 127.0.0.1:3080，profile 为 web；插件以本地包方式安装进该 profile 后即可在 GUI 中生效。
    - 设计工程数据放在当前工作区（session cwd）下的 `.design/`，可进 git、可 diff、可被 agent 直接 read/write/edit。
    - 每屏 HTML 自包含（样式与 token 内联），避免沙箱 iframe 里的相对路径/跨文件依赖问题。
    - agent 修改页面内容优先复用其原生 read/write/edit 能力操作 `.design/frames/*.html`，设计专用工具只做"画布状态读写 + 广播刷新 + 校验"，不重复造文件编辑能力。
  blocking_questions:
    - q: 这个仓库的定位是"DSH 原生插件主打真无限画布"、"借力 OpenDesign 只补画布层"，还是"先自用不出圈"？
      answered: true
      asked_at: "2026-10-08"
      answer: "DSH 原生插件，主打它没有的那块：真无限画布 + 边聊边改（推荐）"
    - q: 画布上摆的东西是真实网页、矢量图形，还是混合？
      answered: true
      asked_at: "2026-10-08"
      answer: "真实网页：每屏一个 HTML，沙箱渲染，可点可滚（推荐）"
    - q: 第一刀砍多大？
      answered: true
      asked_at: "2026-10-08"
      answer: "窄闭环：对话 → 画布出 1~3 屏 → 就地和聊天改 → 落成代码（推荐）"
  open_questions:
    - q: 设计工程文件放在工作区 `.design/` 目录是否合适（会不会污染用户仓库）？
      status: assumed
      asked_at: "2026-10-08"
      answer: ""
      assumption: 放在工作区根目录 `.design/`，随仓库走，可 git 管理。
      if_wrong: 若用户不想仓库里多这层目录，改为放到 ~/.dsh/storages 下按 workspace 哈希隔离，代价是 agent 无法用普通 read/edit 直接读写（要改走专用工具，复杂度上升）。
      confirm_by: "P0 验收前"
    - q: 插件是否需要发布到 npm / 供他人安装？
      status: assumed
      asked_at: "2026-10-08"
      answer: ""
      assumption: P0 只做本地安装（profile 内生效），不发布、不做版本化发布流程。
      if_wrong: 需要补打包、npm 发布、版本兼容矩阵与安装文档，额外 1 个迭代。
      confirm_by: "P0 完成后"
    - q: 画布上的 frame 需要"可交互原型"（点击跳转/多状态）吗？
      status: assumed
      asked_at: "2026-10-08"
      answer: ""
      assumption: P0 只做静态渲染（可滚动、hover 生效），不做页面内跳转与状态编排。
      if_wrong: 需要引入状态机与热区定义，属于 P2 范围。
      confirm_by: "P0 验收时"

  inputs:
    - name: 用户需求描述
      description: 用户在 DSH 对话框里用自然语言描述要设计的界面（如"做一个 SaaS 后台的订单列表页"）。
      source: 用户输入
      required: true
    - name: 工作区路径
      description: 当前 session 的 cwd，用于定位 `.design/` 设计工程。
      source: DSH session
      required: true
    - name: 用户在画布上的操作
      description: 拖动 frame、改尺寸、iframe 内选中元素并改文字/颜色/间距、留批注。
      source: 客户端画布 UI
      required: false
    - name: 参考素材（P1）
      description: 用户给的截图/网址，用于提取品牌色与风格。
      source: 用户上传 / web_fetch
      required: false

  outputs:
    format: 文件 + GUI 交互界面 + 给 agent 的工具返回值（JSON）
    schema: |
      .design/design.json:
        { version: 1,
          viewport: { x: number, y: number, zoom: number },
          tokens: { "color.primary": "#hex", "space.2": "8px", ... },   # 与 tokens.css 同源，只做只读镜像
          frames: [ { id: string, name: string, file: string, width: number, height: number,
                      x: number, y: number, background?: string, status: "draft"|"ready" } ],
          comments: [ { id: string, frameId: string, target?: string, text: string,
                        x: number, y: number, resolved: boolean, createdAt: string } ] }
      .design/frames/<id>.html        自包含 HTML（样式与 token 内联），一屏一文件
      .design/tokens.css              设计契约（CSS 变量），P0 内置 3 套预设可切换
      工具返回：design_status → { project, frames[], tokens, comments[], selection }；
                design_frame_write → { id, file, bytes }；
                design_canvas_apply → { applied: [...], design }
    path: <workspace>/.design/（数据）；<workspace>/src/ 或用户指定目录（落地代码）

  constraints:
    - 必须做成 DSH 插件（Cordis），不新增常驻独立服务、不占新端口；不改 DSH 自身代码。
    - 客户端代码必须走 `dsh.client` 打包契约（tsdown 产物形如 window.__ModuleLoader__.load），inject 只声明真实存在的客户端服务。
    - 渲染模型生成的 HTML 必须在沙箱 iframe 中，**禁止** allow-same-origin；这是安全红线。
    - 不引入 tldraw（非开源许可，生产要付费 + 水印）；画布自研。
    - 只做单向 设计→代码；不实现"代码改动反推回设计"的双向同步。
    - 每个 frame 自包含；不依赖 iframe 内的相对路径资源。
    - 所有 AC 必须在真实 GUI（http://127.0.0.1:3080）里可复现，不能只靠单测自证。
    - 单一写者原则：同一时刻同一文件只允许一个成员修改；脚手架/接口冻结前，其他人不得并行改 client/host 边界文件。
  out_of_scope:
    - 图层面板、矢量钢笔、布尔运算、吸附对齐引擎、自动布局算法
    - 多人实时协同、评论 @ 提醒、分享链接
    - 组件变体/组件库管理/插件市场
    - Figma / Sketch 文件导入
    - 代码 → 设计反向同步
    - 移动端原生设计稿、动效编排、视频导出
    - 发布到 npm、多用户权限体系
  tools:
    - cordis_inspect_list
    - cordis_inspect_query
    - plugin_manager
    - mcp__playwright-mcp（browser_navigate / browser_snapshot / browser_take_screenshot / browser_evaluate / browser_console_messages）
    - bash
    - read / write / edit / glob / grep
    - team_task_* / spawn_teammate / send_message / wait_agent
  steps:
    - "S1（前置，串行）插件脚手架与安装：建包 + host 半 + client 半 + tsdown 打包 + 装进 web profile，使左侧栏出现「设计」图标、点击可切到一张空白画布页；同时冻结 client/host 共享类型契约（帧/批注/操作的类型定义文件），作为后续并行开发的接口基准。"
    - "S2（可与 S3 并行）host 数据层与 agent 工具：`.design/` 工程读写（design.json / frames / tokens.css）、初始化预设、design_status / design_frame_write / design_canvas_apply 三个工具、非法 JSON 与不可写目录的错误处理、以及面向客户端的 Remote 写接口。"
    - "S3（可与 S2 并行）画布客户端：无限画布（平移/缩放/适应）、frame 沙箱渲染、选中与拖动、改尺寸、iframe 内元素探针与属性改写、批注气泡、以及订阅 `workspaceFiles.changes` 实现文件变更自动刷新。"
    - "S4 设计契约与落地出口：3 套内置 token 预设 + 2~3 个 frame 起步模板 + 注入 systemPrompt 的设计约定 + 「落地到项目」链路（把选中 frame 交给 agent 转成项目代码写入 src/）。"
    - "S5 集成与独立验收：装齐后在 127.0.0.1:3080 跑通窄闭环，逐条核对 AC，独立复核者不参与实现。"
  acceptance_criteria:
    - "AC1 挂载可见：DSH 启动后，http://127.0.0.1:3080 左侧栏出现「设计」图标；点击后主面板切到画布页面，页面在 3 秒内渲染完成，浏览器控制台无未捕获异常。"
    - "AC2 同屏：画布打开后聊天输入框与画布同时可见（右侧栏标签页、shell.overlay 浮层或等价分屏任一实现均可），用户无需在两个面板间来回切换即可边看边聊。"
    - "AC3 对话生成：在对话里发送「设计一个 SaaS 后台的订单列表页」后，agent 调用设计工具，画布上出现 1~3 个 frame，每个 frame 内渲染出非空白的真实页面（可见文字或结构），frame 实际渲染宽高与 design.json 声明值一致。"
    - "AC4 落盘：生成后工作区出现 `.design/design.json` 与 `.design/frames/*.html`；design.json 中每个 frame 含 id/name/width/height/x/y 字段，且改动可被 `git diff` 观察到。"
    - "AC5 画布操作持久化：拖动某个 frame 改变位置后刷新浏览器，该 frame 仍出现在拖动后的位置（位置已写入 design.json）。"
    - "AC6 就地改元素：在 frame 内选中一个文本元素并修改其文字后，`.design/frames/<id>.html` 中对应文字被改写；随后 agent 读取该屏时看到的是修改后的文字。"
    - "AC7 对话改设计自动刷新：在对话里说「主色换成深蓝、间距放大一点」，agent 修改文件后画布在 2 秒内自动刷新出新样式，无需用户手动刷新，且 frame 位置与缩放不被打断。"
    - "AC8 批注闭环：在画布上留一条批注「这个按钮太土了」后，agent 调用 design_status，返回结果中包含这条未处理批注的原文及其所属 frameId。"
    - "AC9 落代码：对选中的 frame 触发「落地到项目」，agent 把该屏转成项目技术栈的组件文件写入 src/（或用户指定目录）并返回写入路径；生成文件不包含指向 `.design/` 的相对路径引用。"
    - "AC10 安全（失败路径）：在 frame HTML 中注入 `<script>parent.document.title='pwned'</script>` 与读取 document.cookie 的脚本并刷新画布后，DSH 页面标题不变、frame 内脚本无法访问父窗口、控制台出现沙箱拦截相关信息。"
    - "AC11 边界容错：frame HTML 为 0 字节或超过 2MB 时画布不崩溃，显示明确错误占位与提示；design.json 被手工改成非法 JSON 时，插件回退为空工程并把坏文件另存为 design.json.bak，不抛未捕获异常。"
    - "AC12 失败可读：`.design/` 目录不可写时，agent 工具返回的错误信息包含失败路径与原因，且不静默成功。"
  verification: {}
  follow_ups: []
  failure_handling:
    - scenario: 插件安装进 profile 失败或打包产物不合法（客户端报 __ModuleLoader__ 相关错误）
      handling: 回退到最小可加载骨架（只注册一个静态面板）逐层定位；保留安装脚本可重复执行；不修改 DSH 自身代码绕过。
    - scenario: GUI 已在运行但插件未热更新
      handling: 按 DSH 插件安装流程重载（必要时重启 profile），并在 AC 中记录"刷新页面后生效"的确切步骤，避免把"没刷新"误判为功能失败。
    - scenario: iframe 渲染超大/空白/含死循环脚本导致页面卡死
      handling: iframe 加超时占位与 sandbox 限制；超过 2MB 拒绝渲染并显示占位；卡死时提供"重新加载该 frame"按钮。
    - scenario: agent 不按约定调用设计工具（直接写文件或不写）
      handling: 通过 systemPrompt 注入的设计约定 + 工具描述纠偏；画布对文件变更始终监听，即使 agent 绕过工具直接改文件也能刷新；连续 2 轮未产出 frame 时在工具返回值中给出明确下一步指令。
    - scenario: 写入文件与用户并发编辑冲突
      handling: 采用"最后写入者胜 + 变更广播"；P0 不做冲突合并，但每次写入附带修改来源（user/agent）记录到 design.json 便于追溯。
  examples:
    - input: 用户在对话里说「设计一个 SaaS 后台的订单列表页」，随后在画布上把第二个 frame 拖到右边，并留批注「这个按钮太土了」，再在对话里说「主色换成深蓝」。
      output: 画布出现 2 个 frame（订单列表 + 订单详情），`.design/frames/order-list.html` 与 `order-detail.html` 生成；design.json 记录两个 frame 的坐标；批注进入 comments[]；agent 读到批注与选中态后修改 tokens.css 的 color.primary 并调整按钮样式，画布 2 秒内自动刷新；最后点「落地到项目」，agent 输出 src/pages/orders/list.tsx。
