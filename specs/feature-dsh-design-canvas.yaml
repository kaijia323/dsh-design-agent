    - "F5（中，触发条件：要给「自动打开」定论时）：「`.design/` 首次出现自动打开预览面板」**无法验证**——抑制状态只能靠「用户手动关闭面板」构造，而手动关闭本身就会触发抑制，于是无法区分「没实现」与「被正确抑制」。必须先给抑制状态一个可重置/可观测的手段才能验；在此之前该能力在 SPEC 的 verification.unverified 里如实标注。"
