    - "F8（中，触发条件：下一轮动 client.js 时）：AC9 的落地指令让人「看 `src/` 的现有目录、跟随现有约定」，在**插件型仓库**里会失灵——本仓库 `src/` 下只有插件后端代码，且 `src/` 正是 `package.json` 的 `files`/`exports` 发布范围（验收时执行 agent 因此把页面写进了 `src/generated/`，会跟着插件一起发布）。建议指令里补一句：目标路径若落在包的 `files`/`exports` 发布范围内，改写 `<workspace>/design-preview/` 之类的工作区目录，或先问用户。改这句话要动 client.js 的 `handoffInstruction()`，需重新冻结并让独立验收者复查 AC9，故不在本版做。"
