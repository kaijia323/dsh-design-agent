      note: "验收后的仓库卫生与打包修正（不改任何被验收的行为）：① 截图/预览图 11 张移出版本控制（审计显示它们占仓库体积七成且无文档引用），改为本地保留、按需重跑；② 误入索引的 Playwright 401 页面快照删除；③ 别的会话产物 feature-order-list-page.yaml 移出 specs/ 到 docs/evidence/；④ AC9 物证从 src/generated/ 移到 docs/evidence/handoff-output/（src/ 是插件发布源码树，放业务页面会跟着发布）；⑤ 修正 package.json 的 files——原先漏了运行时必需的 design-system/ 与 prompts/，本地 link 安装不过滤所以一直没暴露，真打包会退化成没有设计契约与预设模板。新增 F8（落地指令的目标路径在插件型仓库里会失灵）与 F9（发布前复核 files 与实际读取路径一致）。"
  related: []
  goal: 让用户在 DSH 聊天窗口里，通过对话让 agent 以「每屏一个真实 HTML」为单位设计 UI；用户在右侧预览面板里边聊边看，可切换屏幕、点元素就地改文字/颜色/间距、点元素写批注，满意后由 agent 把设计落成前端代码——从而把「先设计 UI 再写前端」这条流程搬回 AI 研发链路里。
  context: |
    背景与痛点：现在直接让 agent 写前端页面，出来的东西很丑、没设计感。根因不是模型不会写 CSS，而是：
    缺设计契约（token/字号阶梯/间距节奏）、缺参考物、缺自检、缺快速迭代手段（"再往左一点"要用文字来回聊二十轮）。
    因此本插件第一刀就同时交付一套内置设计 token 预设与设计约定，否则预览只会把丑的东西显示得更清楚。

    **形态决策（v4，重要）**：P0 的第一版实现过"真无限画布"（平移/缩放/多屏并排/拖动改位置）。
    用户在真实界面里用过之后，明确决定砍掉：**"整个画布都多余，我只要聊天 + 一个预览框"**；
    随后确认预览框要保留"点元素就地改属性"与"点元素写批注"两项能力（**"上面都要，再加点元素写批注"**）。
    这个判断与早期调研结论一致——调研者当时也建议不做无限画布，理由是同类产品都收敛到
    "设计系统 + agent 写真实文件 + 并排预览"；当时被 Lead 以"差异化"为由保留，实测后确认是多做的。
    成本核对：画布的"无限"部分（相机与坐标换算）约 140 行、拖动约 60 行、并排世界图层约 60 行、
    世界坐标批注浮层约 150 行。而沙箱渲染、探针、读写通道、变更订阅、错误提示这些**跨形态复用**。

    竞品与情报（2026-10-08 调研结论）：
    - Anthropic 的 Claude Design 已是同形态商业产品：聊天 + 画布、就地批注、可直接拖拽改、设计系统、handoff 给 Claude Code。
    - nexu-io/open-design（Apache-2.0）是开源替代，且把 DSH 当一等公民运行时；它只有单页 HTML + 沙箱 iframe 预览，没有多屏空间编排。
    - 没有任何主流产品把"画布 JSON"当真源：open-design 用 DESIGN.md + 真实文件，Onlook 用代码本身。
    - 设计↔代码双向同步至今无人真正解决（官方 Figma MCP 被批"给的是设计上下文而非可生产代码"）。
    - tldraw SDK 非开源许可：生产环境需付费，免费 hobby 许可强制带水印 → 不引入。

    仍然成立的核心取舍：
    1) 真源=文件（`.design/` 下的 design.json + frames/*.html + tokens.css），UI 只是渲染与编辑入口，不发明新格式。
    2) 每一屏=真实网页（自包含 HTML，沙箱 iframe 渲染），不是矢量图形。
    3) 只做单向 设计→代码，不做反向同步。
    4) 差异化=长在 DSH 里（不用开第二个 app）+ 改动与对话进同一个上下文 + 设计契约层（反 AI 味清单与自检）。

    DSH 扩展点（已用 cordis_inspect_list / cordis_inspect_query 实证）：
    - （v5 起不使用）客户端 `main` slot 与 `sidebar.panellist` slot：曾被用作"左侧栏入口 + 全屏主面板"，
      但左侧栏是全局的、用户看不出设计跟着哪个工作区，已移除。放大视图改走右侧栏的 fullscreen。
    - 客户端 `sidebarRightTabs.register` + `sidebar.right.pane.tab` / `.title` + `ctx.layout.openRightbar(track=true)` → 预览面板停靠右侧栏，边聊边看（AC2 的实现路线，已实测）。
    - 客户端已有 Remote 服务 `workspaceFiles`：`read(sessionId, path, range, signal)` / `stat` / `list` / `changes(sessionId, path, signal)`（**只读，无 workspaceRoot 参数**）。
      注意：`dsh-fs-local` 对目录的监听是 `{ignoreInitial:true, depth:0}`，**监听 `.design` 收不到 `.design/frames/*.html` 的变更**，所以实现用 changes 流 + 定期 stat 轮询双保险。
    - host 侧服务：`tools` / `systemPrompt` / `webServer` / `agents`。
    - 客户端插件包契约：`package.json` 的 `dsh.client` + exports["./client"]；产物形如
      `window.__ModuleLoader__.load({ id, factory: (require) => { ...; exports.apply; exports.inject } })`；无构建步骤。
  assumptions:
    - 本仓库为独立插件包，不 fork、不修改 DSH 自身代码。
    - DSH 运行在 127.0.0.1:3080，profile 为 web；插件以本地目录 link 方式安装。
    - "替换已安装的插件包必须重启 `dsh web` 才会加载新的 host 模块代（Node ESM 缓存；禁用/启用、卸载重装都无效）。client 半刷新页面即可。"
    - 设计工程数据放在当前工作区（session cwd）下的 `.design/`，可进 git、可被 agent 直接 read/write/edit。
    - 每屏 HTML 自包含（样式与 token 内联），避免沙箱 iframe 里的相对路径依赖。
    - agent 改页面内容优先复用原生 read/write/edit 操作 `.design/frames/*.html`；设计工具只做"工程状态读写 + 落盘 + 校验"，不重复造文件编辑能力。
  blocking_questions: []   # 5 条阻塞问题已全部由用户答复并落进 context（形态决策一节）与 AC6/AC8/AC9；按 spec-builder 要求，答复后条目搬走、结论留在正文
  open_questions:
    - q: 设计工程文件放在工作区 `.design/` 目录是否合适（会不会污染用户仓库）？
      status: assumed
      asked_at: "2026-10-08"
      answer: ""
      assumption: 放在工作区根目录 `.design/`，随仓库走，可 git 管理。
      if_wrong: 若用户不想仓库里多这层目录，改为放到 ~/.dsh/storages 下按 workspace 哈希隔离，代价是 agent 无法用普通 read/edit 直接读写（要改走专用工具，复杂度上升）。
      confirm_by: "P0 验收前"
    - q: 插件是否需要发布到 npm / 供他人安装？
      status: assumed
      asked_at: "2026-10-08"
      answer: ""
      assumption: P0 只做本地安装（profile 内生效），不发布、不做版本化发布流程。
      if_wrong: 需要补打包、npm 发布、版本兼容矩阵与安装文档，额外 1 个迭代。
      confirm_by: "P0 完成后"
    - q: 预览框里的屏需要"可交互原型"（点击跳转/多状态）吗？
      status: assumed
      asked_at: "2026-10-08"
      answer: ""
      assumption: P0 只做静态渲染（可滚动、hover 生效），不做页面内跳转与状态编排。
      if_wrong: 需要引入状态机与热区定义，属于 P2 范围。
      confirm_by: "P0 验收时"

  inputs:
    - name: 用户需求描述
      description: 用户在 DSH 对话框里用自然语言描述要设计的界面（如"做一个 SaaS 后台的订单列表页"）。
      source: 用户输入
      required: true
    - name: 工作区路径
      description: 当前 session 的 cwd，用于定位 `.design/` 设计工程。
      source: DSH session
      required: true
    - name: 用户在预览面板上的操作
      description: 切换屏、点选元素改文字/颜色/间距、点选元素写批注。
      source: 客户端预览面板
      required: false
    - name: 参考素材（P1）
      description: 用户给的截图/网址，用于提取品牌色与风格。
      source: 用户上传 / web_fetch
      required: false

  outputs:
    format: 文件 + GUI 交互界面 + 给 agent 的工具返回值（JSON）
    schema: |
      .design/design.json:
        { version: 1,
          viewport: { x: number, y: number, zoom: number },              # v4 起 UI 不再写入，字段保留仅为兼容
          selection: { frameId?: string, commentId?: string, updatedAt: string },
          tokens: { "color.primary": "#hex", "space.2": "8px", ... },   # 与 tokens.css 同源，只做只读镜像
          frames: [ { id: string, name: string, file: string, width: number, height: number,
                      x: number, y: number, background?: string, status: "draft"|"ready" } ],   # x/y v4 起 UI 不再使用
          comments: [ { id: string, frameId: string, target?: string, text: string,
                        x: number, y: number, resolved: boolean, createdAt: string } ] }
          # v4 起批注锚点=target（元素选择器路径），x/y 写 0、不再承担定位语义；找不到元素时该批注显示为"未锚定"但不丢弃
      画布操作词表（host 冻结，UI 与 agent 工具共用同一实现）：
        add_frame | move_frame | resize_frame | rename_frame | delete_frame |
        switch_tokens | add_comment | resolve_comment | set_viewport | select
      其中 v4 起 UI **不再调用** move_frame 与 set_viewport（空间编排已移除），host 保留以兼容与复用。
      未知操作整批拒绝（EUNKNOWN），不做部分应用。
      写通道：host 在既有 webServer 上注册同源 exact route `POST /design-canvas/api`，
        只收 {sessionId, ops}，工作区路径由 host 从 sessionId 解析、绝不接受客户端传路径；
        必需校验 POST-only / Origin 同源 / Sec-Fetch-Site=same-origin / Content-Type: application/json / body 上限 4MiB，
        任一不满足即拒（403/405/413/415）。不用 session command 做高频写，因为它会写 session log 并在聊天里渲染成行。
      .design/frames/<id>.html        自包含 HTML（样式与 token 内联），一屏一文件
      .design/tokens.css              设计契约（CSS 变量），P0 内置 3 套预设可切换
      工具返回：design_status → { project, frames[], tokens, comments[], selection }；
                design_frame_write → { id, file, bytes }；
                design_canvas_apply → { applied: [...], design }
    path: <workspace>/.design/（数据）；<workspace>/src/ 或用户指定目录（落地代码）

  constraints:
    - 必须做成 DSH 插件（Cordis），不新增常驻独立服务、不占新端口；不改 DSH 自身代码。
    - 客户端为**单文件、无构建步骤**（`client.js`，`window.__ModuleLoader__.load` 格式）；不用 tsdown/TS/打包器；不 require 任何 @deepseek-ai/* 客户端包。
    - 渲染模型生成的 HTML 必须在沙箱 iframe 中，**禁止** allow-same-origin；这是安全红线，不得为任何交互便利而放宽。
    - 预览面板不提供空间编排：不做平移、缩放、坐标、拖动改位置、多屏并排。
    - "渲染尺寸策略：**iframe 内部的布局尺寸必须等于 frame 的声明尺寸**（声明 1440×900 就按 1440×900 布局，不得按容器宽度重排）；适配面板只在**外层**用 `transform: scale(min(1, 面板宽/声明宽))` 等比缩放，只缩不放，并显示缩放比例。这条是 AC3 的成立前提，也是「用户看到的必须是他选的那个版式」的保证。"
    - "挂载点唯一：只注册右侧栏标签（`sidebarRightTabs` + `sidebar.right.pane.tab`/`.title`，session 级，天然绑定当前工作区）；不注册 `sidebar.panellist` 左侧栏入口，不注册 `main` 主面板座位——避免用户看不出这块设计跟着哪个工作区。"
    - host 层（`index.js` / `src/host/**`）已通过独立验收，本版**不得修改**；`move_frame` / `set_viewport` / frame 的 x/y 保留但 UI 不调用。
    - 只做单向 设计→代码；不实现"代码改动反推回设计"的双向同步。
    - 每个 frame 自包含；不依赖 iframe 内的相对路径资源。
    - 所有 AC 必须在真实 GUI（http://127.0.0.1:3080）里可复现，不能只靠单测自证。
    - 单一写者原则：同一时刻同一文件只允许一个成员修改；验收窗口内非验收者不得写 `client.js` 与 `.design/`。
