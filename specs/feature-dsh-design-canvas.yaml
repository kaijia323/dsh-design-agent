  failure_handling:
    - scenario: 插件安装进 profile 失败或客户端模块不合法（报 __ModuleLoader__ 相关错误）
      handling: 回退到最小可加载骨架逐层定位；不修改 DSH 自身代码绕过。
    - scenario: 替换已安装包后 host 行为未更新
      handling: 这是 DSH 既定行为（Node ESM 模块缓存），必须重启 `dsh web`；已写入 docs/architecture.md，避免误判为功能失败。
    - scenario: iframe 渲染超大/空白/含死循环脚本
      handling: 0 字节 → 空帧占位；>2 MiB → 先 stat 再决定读、直接拒绝渲染并占位；死循环 → 6 秒无 ready 显示渲染超时占位并提供「重新加载」。
    - scenario: 批注锚点失效（agent 重写 HTML 导致选择器指不到元素）
      handling: 定位失败时在批注列表显示为"未锚定"并保留原文，绝不静默丢弃；P1 考虑给元素注入稳定锚点 id。
    - scenario: agent 不按约定调用设计工具（直接写文件或不写）
      handling: 通过 systemPrompt 设计约定 + 工具描述纠偏；预览对文件变更始终监听，即使 agent 绕过工具直接改文件也能刷新。
    - scenario: 写入文件与用户并发编辑冲突
      handling: 采用"最后写入者胜 + 变更广播"；P0 不做冲突合并，每次写入记录来源（user/agent）到 design.json 便于追溯。
  examples:
    - input: 用户在对话里说「设计一个 SaaS 后台的订单列表页」，然后在预览面板切到第二屏、点选一个按钮把文字改成「导出报表」、并在该按钮上写批注「这个按钮太土了」，最后说「主色换成深蓝」，满意后点「落地到项目」。
      output: 预览面板出现 2 屏（订单列表 + 订单详情），`.design/frames/order-list.html`、`order-detail.html` 落盘并在 design.json 登记；点选改文字后 HTML 文件被改写；批注写入 comments[]（frameId + target 选择器）；agent 读到批注与选中态后切换 token 预设并调整按钮样式，预览 2 秒内自动刷新；最后 agent 输出 `src/pages/orders/list.tsx`。
