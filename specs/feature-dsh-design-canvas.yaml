  acceptance_criteria:
    - "AC1 挂载可见（右侧栏，跟随工作区）：预览面板作为**右侧栏的一个标签**存在，可从右侧栏自身的添加/guide 入口打开（侧栏空态即 guide，需能看到「设计预览」胶囊）；打开后展示的是**当前会话工作区**的 `.design/`（切换会话/工作区后，面板内容随之切换，不会显示别的工作区的设计）；面板在 3 秒内渲染完成，浏览器控制台无未捕获异常（沙箱拦截类日志除外）。左侧栏**不得**再出现「设计」入口。"
    - "AC2 同屏：预览面板打开后，聊天输入框与预览面板**同一时刻**都在视口内且互不遮挡（用 getBoundingClientRect 证明水平零重叠、且命中测试不被遮挡，即 track 挤压而非浮层）。"
    - "AC3 对话生成：在对话里发送「设计一个 SaaS 后台的订单列表页」后，agent 调用设计工具并**新增** 1~3 屏（新增计数以 design.json 的 frames 数量变化为准）；预览面板可在这些屏之间切换，每屏渲染出非空白的真实页面。**尺寸判定口径：比较「frame 自身的内容尺寸」与 design.json 的声明值**（该屏文档的布局宽 = 声明 width、文档 scrollHeight ≈ 声明 height）；**预览视口尺寸由右侧栏宽度决定，与声明值不同不算违规**（它是外层容器，允许留白与滚动）。"
    - "AC4 落盘：生成后工作区出现 `.design/design.json` 与 `.design/frames/*.html`；design.json 中每个 frame 含 id/name/width/height 字段；`git status --porcelain` 能列出这些文件，且 `git add -N .design/` 之后 `git diff` 能看到内容变化（未跟踪文件对 git diff 不可见，故用此口径）。"
    - "AC5 切屏与恢复：当工程有 2 屏以上时，切屏控件能在各屏之间切换且每次切换后渲染的是该屏内容（不是上一屏残留）；刷新浏览器后仍停留在刷新前那一屏（由 design.json 的 selection.frameId 恢复）。"
    - "AC6 就地改元素：在预览中点选一个文本元素并修改其文字后，`.design/frames/<id>.html` 中对应文字被改写；随后 agent 读取该屏时看到的是修改后的文字。"
    - "AC7 自动刷新：agent 修改文件后预览在 2 秒内自动刷新出新样式，无需用户手动刷新；必须单独验证「只改 `.design/frames/<id>.html`（design.json 不变）」这条路径；刷新不得重置用户的滚动位置与选中态。"
    - "AC8 批注闭环：在预览中点选某元素写一条批注「这个按钮太土了」后，agent 调用 design_status 能读到该批注的原文、所属 frameId 与 target 选择器；若之后 HTML 被重写导致选择器失效，该批注仍出现在列表里并标记为未锚定，不得静默丢失。"
    - "AC9 落代码：对当前屏触发「落地到项目」，agent 把该屏转成项目技术栈的组件文件写入 src/（或用户指定目录）并返回写入路径；生成文件不包含指向 `.design/` 的相对路径引用。"
    - "AC10 安全（失败路径）：在 frame HTML 中注入 `parent.document.title='pwned'`、读 document.cookie、`top.location` 跳转与 parent.localStorage 访问的脚本并让其渲染后，DSH 页面标题与 URL 不变、frame 内脚本无法访问父窗口（SecurityError）、控制台出现沙箱拦截信息，且**不得出现 Chrome 的 'can escape its sandboxing' 警告**。"
    - "AC11 边界容错：frame HTML 为 0 字节、或超过 2 MiB（=2,097,152 字节，实现必须用这个阈值而非十进制 2,000,000）时，预览面板不崩溃并显示明确错误占位与「重新加载」；design.json 被手工改成非法 JSON 时，插件回退为空工程并把坏文件另存为 design.json.bak，不抛未捕获异常。验收需覆盖 0 / 1 / 1,999,999 / 2,000,000 / 2,000,001 / 2,097,152 / 2,097,153 字节七个边界值，并报告实现的实际阈值。"
    - "AC12 失败可读：`.design/` 目录不可写时，agent 工具返回的错误信息包含失败路径与原因，且不静默成功；预览端的写操作失败时同样可见（顶部提示含宿返回的错误原因），不静默吞掉。"
