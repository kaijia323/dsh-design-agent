<!doctype html>
<html lang="zh-CN" data-template="mobile-home" data-preset="editorial-warm">
<head>
<meta charset="utf-8">
<title>移动端首页 · 编辑部暖调</title>
<!-- @design-template id=mobile-home preset=editorial-warm width=390 height=844 -->
<!-- 起步模板：可直接当 .design/frames/mobile-home.html 使用。内容为示例文案，不是真实文章。 -->
<style>
/* 预设 editorial-warm 的 :root 块，与 design-system/tokens/editorial-warm.css 逐字一致。
   切换预设时整块替换即可，其余样式只引用变量，不出现任何自创颜色。 */
:root {
  --color-primary: #9c4a2a;
  --color-primary-hover: #7f3a1f;
  --color-primary-weak: #f6e7df;
  --color-on-primary: #fffaf5;
  --color-accent: #3a6152;
  --color-accent-weak: #e4ece7;
  --color-bg: #f7f3ec;
  --color-surface: #fffdf8;
  --color-surface-sunken: #efe8dd;
  --color-border: #e2d8c8;
  --color-border-strong: #c9bba4;
  --color-text: #1c1a17;
  --color-text-muted: #5f5a51;
  --color-text-faint: #857e73;
  --color-success: #2f6b4a;
  --color-warning: #8a5a12;
  --color-danger: #a8341f;
  --color-focus: rgba(156, 74, 42, 0.26);
  --font-display: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Courier New", monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-md: 16px;
  --text-lg: 19px;
  --text-xl: 24px;
  --text-2xl: 32px;
  --text-3xl: 42px;
  --text-4xl: 56px;
  --leading-tight: 1.15;
  --leading-snug: 1.4;
  --leading-normal: 1.75;
  --leading-relaxed: 1.9;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --space-0: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-full: 999px;
  --shadow-sm: 0 1px 0 rgba(60, 45, 25, 0.06);
  --shadow-md: 0 6px 18px -12px rgba(60, 45, 25, 0.28);
  --shadow-lg: 0 12px 32px -16px rgba(60, 45, 25, 0.32);
  --layout-max: 1080px;
  --layout-gutter: 32px;
  --control-h: 40px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: var(--text-md);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

.serif { font-family: var(--font-display); }
.muted { color: var(--color-text-muted); }
.faint { color: var(--color-text-faint); }
.rule { height: 1px; background: var(--color-border); }

.phone {
  display: flex; flex-direction: column;
  width: 390px; height: 844px; overflow: hidden;
  background: var(--color-bg);
}

/* ── 状态栏 ─────────────────────────────────── */
.status {
  display: flex; align-items: center; justify-content: space-between;
  height: 44px; padding: 0 var(--space-5);
  font-size: var(--text-xs); font-weight: var(--weight-medium);
  font-variant-numeric: tabular-nums;
}
.status-icons { display: flex; align-items: center; gap: var(--space-2); }
.status-icons svg { display: block; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
.bars i { width: 3px; background: var(--color-text); border-radius: 1px; }
.bars i:nth-child(1) { height: 4px; }
.bars i:nth-child(2) { height: 6px; }
.bars i:nth-child(3) { height: 8px; }
.bars i:nth-child(4) { height: 10px; opacity: 0.3; }

/* ── 顶栏 ───────────────────────────────────── */
.appbar {
  display: flex; align-items: center; gap: var(--space-3);
  height: 56px; padding: 0 var(--space-5);
  border-bottom: 1px solid var(--color-border);
}
.wordmark { font-family: var(--font-display); font-size: var(--text-xl); font-weight: var(--weight-semibold); letter-spacing: 0.04em; }
.appbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--radius-full); color: var(--color-text-muted); }
.icon-btn:hover { background: var(--color-surface-sunken); color: var(--color-text); }
.avatar {
  width: 32px; height: 32px; border-radius: var(--radius-full);
  background: var(--color-primary-weak); color: var(--color-primary);
  display: grid; place-items: center;
  font-size: var(--text-xs); font-weight: var(--weight-medium);
}

/* ── 主体 ───────────────────────────────────── */
.scroll { flex: 1; display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-5); overflow-y: auto; overflow-x: hidden; }

.dateline {
  display: flex; align-items: center; gap: var(--space-3);
  font-size: var(--text-xs); color: var(--color-text-faint);
  letter-spacing: 0.04em;
}
.dateline .rule { flex: 1; }

.kicker {
  display: inline-flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-xs); font-weight: var(--weight-medium);
  color: var(--color-accent); letter-spacing: 0.16em;
}
.kicker::before { content: ""; width: 18px; height: 1px; background: var(--color-accent); }

.hero { display: flex; flex-direction: column; gap: var(--space-3); }
.hero-title {
  margin: 0;
  font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-medium);
  line-height: var(--leading-tight); letter-spacing: 0.01em;
}
.hero-dek { margin: 0; font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-normal); }
.hero-meta { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-text-faint); }
.hero-meta .sep { width: 1px; height: 10px; background: var(--color-border-strong); }

.chips { display: flex; gap: var(--space-2); }
.chip {
  display: inline-flex; align-items: center; height: 28px; padding: 0 var(--space-3);
  border: 1px solid var(--color-border); border-radius: var(--radius-full);
  font-size: var(--text-xs); color: var(--color-text-muted); background: var(--color-surface);
}

.section-head { display: flex; align-items: baseline; gap: var(--space-3); }
.section-title { font-family: var(--font-display); font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.section-more { margin-left: auto; font-size: var(--text-xs); color: var(--color-primary); }

.stories { display: flex; flex-direction: column; }
.story { display: flex; gap: var(--space-4); padding: var(--space-3) 0; border-top: 1px solid var(--color-border); }
.story:first-child { border-top: 0; padding-top: 0; }
.story-no {
  font-family: var(--font-display); font-size: var(--text-xl); color: var(--color-border-strong);
  line-height: var(--leading-tight); min-width: 34px; font-variant-numeric: tabular-nums;
}
.story-body { min-width: 0; }
.story-title { margin: 0; font-family: var(--font-display); font-size: var(--text-lg); font-weight: var(--weight-medium); line-height: var(--leading-snug); }
.story-meta { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--color-text-faint); }

/* ── 底部标签栏 ─────────────────────────────── */
.tabbar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: 64px; border-top: 1px solid var(--color-border);
  background: var(--color-surface);
  padding-bottom: var(--space-2);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1);
  font-size: var(--text-xs); color: var(--color-text-faint);
}
.tab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab.is-active { color: var(--color-primary); font-weight: var(--weight-medium); }
</style>
</head>
<body>

<div class="phone">
  <div class="status">
    <span>9:41</span>
    <span class="status-icons">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1 3.6a9 9 0 0 1 13 0"/><path d="M3.6 6.4a5.4 5.4 0 0 1 7.8 0"/><circle cx="7.5" cy="9.2" r="0.9" fill="currentColor" stroke="none"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.7" y="0.7" width="20" height="9.6" rx="2.6" stroke="currentColor" stroke-width="1.1" opacity="0.5"/><rect x="2.4" y="2.4" width="14" height="6.2" rx="1.4" fill="currentColor"/><path d="M22.6 4.1v2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/></svg>
    </span>
  </div>

  <header class="appbar">
    <span class="wordmark">晨读</span>
    <span class="appbar-right">
      <button class="icon-btn" type="button" aria-label="搜索">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.25" cy="7.25" r="4"/><path d="m10.2 10.2 3.3 3.3"/></svg>
      </button>
      <span class="avatar">禾</span>
    </span>
  </header>

  <main class="scroll">
    <div class="dateline"><span>2026 年 10 月 8 日 · 星期四</span><span class="rule"></span><span>第 128 期</span></div>

    <article class="hero">
      <span class="kicker">封面故事</span>
      <h1 class="hero-title">先把界面画出来，<br>再让 AI 写代码</h1>
      <p class="hero-dek">上一代做法是直接让模型写前端：出得快，但十屏一个样。把设计提前一步，返工反而更少。</p>
      <div class="hero-meta"><span>编辑部</span><span class="sep"></span><span>12 分钟阅读</span><span class="sep"></span><span>3 条批注</span></div>
    </article>

    <div class="chips">
      <span class="chip">设计系统</span>
      <span class="chip">中文排版</span>
      <span class="chip">评审方法</span>
    </div>

    <div class="rule"></div>

    <section>
      <div class="section-head">
        <span class="section-title">今日精选</span>
        <span class="section-more">全部 24 篇</span>
      </div>
      <div class="stories">
        <article class="story">
          <span class="story-no">01</span>
          <div class="story-body">
            <h2 class="story-title">中文界面的行高怎么算</h2>
            <p class="story-meta">排版 · 8 分钟阅读</p>
          </div>
        </article>
        <article class="story">
          <span class="story-no">02</span>
          <div class="story-body">
            <h2 class="story-title">设计 token 是决策记录</h2>
            <p class="story-meta">设计系统 · 11 分钟阅读</p>
          </div>
        </article>
        <article class="story">
          <span class="story-no">03</span>
          <div class="story-body">
            <h2 class="story-title">AI 生成的界面为何都一个样</h2>
            <p class="story-meta">观察 · 6 分钟阅读</p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab is-active" type="button">
      <svg viewBox="0 0 20 20"><path d="M3.5 8.5 10 3.5l6.5 5v8h-4.5v-4.5h-4v4.5H3.5Z"/></svg>
      今日
    </button>
    <button class="tab" type="button">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5v13M3.5 10h13"/></svg>
      发现
    </button>
    <button class="tab" type="button">
      <svg viewBox="0 0 20 20"><path d="M4.5 3.5h8a3 3 0 0 1 3 3v10H6a1.5 1.5 0 0 1-1.5-1.5Z"/><path d="M6.5 7h6"/></svg>
      书架
    </button>
    <button class="tab" type="button">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="7.5" r="3"/><path d="M4.5 16.5c0-3 2.4-4.6 5.5-4.6s5.5 1.6 5.5 4.6"/></svg>
      我的
    </button>
  </nav>
</div>

</body>
</html>
